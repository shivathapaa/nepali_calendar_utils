name: Test

# Reusable test workflow: runs the unittest suite across every supported Python
# version and operating system. Used by ci.yml (per push / PR) and by
# publish-pypi.yml as a release gate, so a release can never ship on a red suite.
#
# Windows and macOS legs are included on purpose: the library depends on no IANA
# tz database (Nepal time is a fixed +05:45 offset), and these legs lock that
# portability in.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Surface failures from every combination even if one fails, so the release
      # gate sees the complete picture.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Counted rather than trusted: on Python 3.11 a discovery that finds nothing still exits 0,
      # and a test file renamed out of the test_*.py pattern disappears from the run silently.
      # MINIMUM_TESTS is a floor. Adding tests never trips it; losing a file does.
      #
      # Set so that losing even the smallest test file falls below it, which is the whole point: a
      # floor further down than that lets a dropped file pass. The smallest file is 6 cases against
      # a total of 489 when last measured, on 3.1.0, so the floor sits 6 under. Re-measure and
      # raise it whenever the suite changes; counting per file locally is enough.
      - name: Run tests
        # bash on every leg: the Windows runner defaults to PowerShell, which has no heredoc.
        shell: bash
        env:
          MINIMUM_TESTS: 483
        run: |
          python - <<'PY'
          import os, sys, unittest

          minimum = int(os.environ["MINIMUM_TESTS"])
          suite = unittest.defaultTestLoader.discover("tests")
          discovered = suite.countTestCases()
          print(f"Discovered {discovered} tests")
          if discovered < minimum:
              print(
                  f"::error::Discovered {discovered} tests, expected at least {minimum}. "
                  "A test module has stopped being collected; a release must not be published "
                  "from this."
              )
              sys.exit(1)

          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
