name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Full unittest suite across the supported Python versions and operating systems.
  test:
    uses: ./.github/workflows/_test.yml

  # Packaging sanity: build the sdist + wheel and import from the built wheel, so
  # a broken build config is caught on every PR rather than only at release time.
  build:
    name: Build sanity (sdist + wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the package
        run: |
          python -m pip install --upgrade pip
          pip install hatch
          hatch build

      - name: Install the built wheel and smoke-import
        run: |
          pip install dist/*.whl
          python -c "import nepali_calendar_utils as n; print('import OK, exports:', len(n.__all__))"
